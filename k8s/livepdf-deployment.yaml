apiVersion: apps/v1
kind: Deployment
metadata:
  name: livepdf-server-deployment
  labels:
    app: livepdf-server
spec:
  replicas: 2
  selector:
    matchLabels:
      app: livepdf-server
  template:
    metadata:
      labels:
        app: livepdf-server
    spec:
      containers:
      - name: livepdf-server
        image: kpchiragguptha/livepdf-server:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: livepdf-server-service
spec:
  type: NodePort
  selector:
    app: livepdf-server
  ports:
  - port: 5000
    targetPort: 5000
    nodePort: 30050
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: livepdf-client-deployment
  labels:
    app: livepdf-client
spec:
  replicas: 2
  selector:
    matchLabels:
      app: livepdf-client
  template:
    metadata:
      labels:
        app: livepdf-client
    spec:
      containers:
      - name: livepdf-client
        image: kpchiragguptha/livepdf-client:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: livepdf-client-service
spec:
  type: NodePort
  selector:
    app: livepdf-client
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30080
