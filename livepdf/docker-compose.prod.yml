version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: livepdf-postgres-prod
    environment:
      POSTGRES_DB: livepdf
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - pgdata-prod:/var/lib/postgresql/data
    restart: always
    networks:
      - livepdf-network-prod

  redis:
    image: redis:7-alpine
    container_name: livepdf-redis-prod
    restart: always
    volumes:
      - redisdata-prod:/data
    networks:
      - livepdf-network-prod

  api:
    image: ${API_IMAGE:-kpchiragguptha/livepdf-server:latest}
    container_name: livepdf-api-prod
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=livepdf
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - JWT_SECRET=${JWT_SECRET:-livepdf_production_fallback_jwt_secret_key_2026}
      - REDIS_URL=redis://redis:6379
      - CLIENT_URL=${CLIENT_URL:-https://live-pdf.duckdns.org}
      - DIFF_SERVICE_URL=http://python-diff:8001
      - EMAIL_HOST=${EMAIL_HOST:-smtp.gmail.com}
      - EMAIL_PORT=${EMAIL_PORT:-587}
      - EMAIL_USER=${EMAIL_USER}
      - EMAIL_PASS=${EMAIL_PASS}
      - SENDGRID_API_KEY=${SENDGRID_API_KEY}
    depends_on:
      - postgres
      - redis
    restart: always
    networks:
      - livepdf-network-prod
    volumes:
      - uploads-data:/app/uploads

  worker:
    image: ${API_IMAGE:-kpchiragguptha/livepdf-server:latest}
    container_name: livepdf-worker-prod
    command: node worker.js
    environment:
      - NODE_ENV=production
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=livepdf
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - REDIS_URL=redis://redis:6379
      - EMAIL_HOST=${EMAIL_HOST:-smtp.gmail.com}
      - EMAIL_PORT=${EMAIL_PORT:-587}
      - EMAIL_USER=${EMAIL_USER}
      - EMAIL_PASS=${EMAIL_PASS}
      - SENDGRID_API_KEY=${SENDGRID_API_KEY}
    depends_on:
      - postgres
      - redis
    restart: always
    networks:
      - livepdf-network-prod
    volumes:
      - uploads-data:/app/uploads

  python-diff:
    image: ${PYTHON_IMAGE:-kpchiragguptha/livepdf-python:latest}
    container_name: livepdf-python-diff-prod
    environment:
      - PORT=8001
    restart: always
    volumes:
      - uploads-data:/server/uploads
    networks:
      - livepdf-network-prod

  client:
    image: ${CLIENT_IMAGE:-kpchiragguptha/livepdf-client:latest}
    container_name: livepdf-client-prod
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    restart: always
    networks:
      - livepdf-network-prod

volumes:
  pgdata-prod:
  redisdata-prod:
  uploads-data:

networks:
  livepdf-network-prod:
    driver: bridge
